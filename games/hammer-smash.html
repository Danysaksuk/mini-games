<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Hammer Smash</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/shared.js"></script>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #0d0d1a; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="game-hud">
    <button class="hud-back" onclick="SharedGame.goHome()">← Hub</button>
    <div class="hud-score-block">
      <div id="hudScore" class="hud-score">0</div>
      <div class="hud-label">Points</div>
    </div>
    <div class="hud-right" style="text-align: right;">
      <div id="hudTimer" style="font-family:'Fredoka One',cursive; font-size:1.4rem; color:var(--red);">45s</div>
      <div class="hud-label">Time</div>
    </div>
  </div>

  <div id="startOverlay" class="start-overlay">
    <div class="start-box">
      <span class="game-emoji">🔨</span>
      <h1>Hammer Smash</h1>
      <p class="instructions">Smash moles and stars as fast as you can! Tap carefully — avoid clicking BOMBS. 45 seconds on the clock.</p>
      <div style="font-size:0.8rem; font-weight:700; color:var(--text-dim); margin-bottom:12px;">
        🟤 Mole (+1) | 🟡 Gold (+3) | ⭐ Star (+5) | 💣 Bomb (-3)
      </div>
      <div class="best">⭐ Personal Best: <span id="startBest">0</span></div>
      <button id="startBtn" class="btn btn-primary btn-lg btn-full" style="background: linear-gradient(135deg, #ff6b9d, #d83d73);">START SMASHING</button>
    </div>
  </div>

  <div id="gameoverOverlay" class="gameover-overlay hidden">
    <div class="gameover-box">
      <span class="result-emoji" id="goEmoji">🔨</span>
      <h2>Times Up!</h2>
      <div id="goNewHigh" class="new-high-badge hidden">🎉 NEW HIGH SCORE!</div>
      <div id="goScore" class="score-big">0</div>
      <div class="score-label">Total Points</div>
      <div class="gameover-actions">
        <button id="restartBtn" class="btn btn-green btn-full">Smash Again</button>
        <button class="btn btn-ghost btn-full" onclick="SharedGame.goHome()">Back to Arcade</button>
      </div>
    </div>
  </div>

  <script>
    const player = SharedGame.guardPlayer();

    const GAME_W = Math.min(window.innerWidth, 480);
    const GAME_H = window.innerHeight;

    let high = SharedGame.getHighScore('hammer-smash');
    document.getElementById('startBest').textContent = high;

    const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function playTone(freq, type = 'sine', duration = 0.08) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    class HammerScene extends Phaser.Scene {
      constructor() {
        super('HammerScene');
      }

      create() {
        this.gameState = 'ready';
        this.score = 0;
        this.timeLeft = 45;
        this.timerEvent = null;

        // Wood / Arena background
        const bg = this.add.graphics();
        bg.fillGradientStyle(0x2d1808, 0x2d1808, 0x42220e, 0x1f0e04, 1);
        bg.fillRect(0, 0, GAME_W, GAME_H);

        // Grid setup: 3 columns x 3 rows (9 holes)
        this.cols = 3;
        this.rows = 3;
        this.holes = [];

        const startY = GAME_H * 0.22;
        const gridH = GAME_H * 0.62;
        const colW = GAME_W / (this.cols + 1);
        const rowH = gridH / this.rows;

        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const hx = colW * (c + 1);
            const hy = startY + (rowH * r) + (rowH * 0.5);

            // Draw hole
            const holeGfx = this.add.graphics();
            // Outer dirt rim
            holeGfx.fillStyle(0x190a02, 1);
            holeGfx.fillEllipse(hx, hy + 4, 82, 44);
            // Deep cavity
            holeGfx.fillStyle(0x0a0401, 1);
            holeGfx.fillEllipse(hx, hy, 74, 36);

            // Item container
            const itemGfx = this.add.graphics();
            itemGfx.x = hx;
            itemGfx.y = hy;

            this.holes.push({
              x: hx,
              y: hy,
              itemGfx: itemGfx,
              state: 'empty', // empty, mole, gold, star, bomb
              timer: 0,
              duration: 1000
            });
          }
        }

        // Tap handling
        this.input.on('pointerdown', (pointer) => {
          if (this.gameState !== 'playing') return;
          this.handleTap(pointer.x, pointer.y);
        });

        // Spawn timer
        this.spawnTimer = 0;
      }

      handleTap(x, y) {
        for (let h of this.holes) {
          if (h.state === 'empty') continue;

          const dist = Phaser.Math.Distance.Between(x, y, h.x, h.y - 12);
          if (dist < 46) {
            this.smashItem(h);
            break;
          }
        }
      }

      smashItem(hole) {
        const type = hole.state;
        hole.state = 'empty';
        hole.itemGfx.clear();

        let deltaScore = 0;
        let color = '#ffd93d';
        let txt = '';

        if (type === 'mole') {
          deltaScore = 1;
          txt = '+1';
          color = '#6bcb77';
          playTone(660, 'sine', 0.1);
        } else if (type === 'gold') {
          deltaScore = 3;
          txt = '+3 GOLD!';
          color = '#ffd93d';
          playTone(990, 'triangle', 0.14);
        } else if (type === 'star') {
          deltaScore = 5;
          txt = '+5 STAR!';
          color = '#4ecdc4';
          playTone(1320, 'sine', 0.18);
        } else if (type === 'bomb') {
          deltaScore = -3;
          txt = '-3 BOOM!';
          color = '#ff4d4d';
          playTone(130, 'sawtooth', 0.25);
          this.cameras.main.flash(200, 255, 0, 0);
        }

        this.score = Math.max(0, this.score + deltaScore);
        document.getElementById('hudScore').textContent = this.score;

        // Floating points popup
        const pop = this.add.text(hole.x, hole.y - 20, txt, {
          fontFamily: 'Fredoka One',
          fontSize: '24px',
          color: color
        }).setOrigin(0.5);

        this.tweens.add({
          targets: pop,
          y: hole.y - 55,
          alpha: 0,
          duration: 500,
          onComplete: () => pop.destroy()
        });
      }

      drawItem(gfx, type) {
        gfx.clear();

        if (type === 'mole') {
          // Brown mole
          gfx.fillStyle(0x795548, 1);
          gfx.fillCircle(0, -14, 22);
          // Snout
          gfx.fillStyle(0xd7ccc8, 1);
          gfx.fillEllipse(0, -10, 16, 12);
          // Nose
          gfx.fillStyle(0xff80ab, 1);
          gfx.fillCircle(0, -12, 4);
          // Eyes
          gfx.fillStyle(0x111111, 1);
          gfx.fillCircle(-8, -18, 3);
          gfx.fillCircle(8, -18, 3);
        } else if (type === 'gold') {
          // Golden mole
          gfx.fillStyle(0xffd700, 1);
          gfx.fillCircle(0, -14, 22);
          // Glow
          gfx.lineStyle(2, 0xffeb3b, 0.8);
          gfx.strokeCircle(0, -14, 24);
          // Snout
          gfx.fillStyle(0xfff59d, 1);
          gfx.fillEllipse(0, -10, 16, 12);
          // Nose
          gfx.fillStyle(0xff80ab, 1);
          gfx.fillCircle(0, -12, 4);
          // Eyes
          gfx.fillStyle(0x111111, 1);
          gfx.fillCircle(-8, -18, 3);
          gfx.fillCircle(8, -18, 3);
        } else if (type === 'star') {
          // Star
          gfx.fillStyle(0xffeb3b, 1);
          gfx.fillCircle(0, -14, 18);
          // Sparkle points
          gfx.fillStyle(0xffd54f, 1);
          for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 2.5) {
            gfx.fillCircle(Math.cos(angle) * 16, -14 + Math.sin(angle) * 16, 6);
          }
          // Smile
          gfx.fillStyle(0x111111, 1);
          gfx.fillCircle(-5, -16, 2.5);
          gfx.fillCircle(5, -16, 2.5);
        } else if (type === 'bomb') {
          // Black bomb sphere
          gfx.fillStyle(0x212121, 1);
          gfx.fillCircle(0, -12, 20);
          // Fuse
          gfx.lineStyle(3, 0xffab00, 1);
          gfx.beginPath();
          gfx.moveTo(0, -32);
          gfx.lineTo(0, -40);
          gfx.strokePath();
          // Spark
          gfx.fillStyle(0xff3d00, 1);
          gfx.fillCircle(0, -42, 5);
          // Skull / cross
          gfx.fillStyle(0xffffff, 0.8);
          gfx.fillRect(-6, -14, 12, 3);
          gfx.fillRect(-2, -18, 4, 11);
        }
      }

      startRun() {
        this.gameState = 'playing';
        this.score = 0;
        this.timeLeft = 45;
        document.getElementById('hudScore').textContent = '0';
        document.getElementById('hudTimer').textContent = '45s';

        this.holes.forEach(h => {
          h.state = 'empty';
          h.itemGfx.clear();
        });

        if (this.timerEvent) this.timerEvent.remove();
        this.timerEvent = this.time.addEvent({
          delay: 1000,
          repeat: 44,
          callback: () => {
            this.timeLeft--;
            document.getElementById('hudTimer').textContent = this.timeLeft + 's';
            if (this.timeLeft <= 0) {
              this.endGame();
            }
          }
        });
      }

      update(time, delta) {
        if (this.gameState !== 'playing') return;

        // Age active items
        for (let h of this.holes) {
          if (h.state !== 'empty') {
            h.timer += delta;
            if (h.timer >= h.duration) {
              h.state = 'empty';
              h.itemGfx.clear();
            }
          }
        }

        // Spawn cadence increases near end
        const interval = Math.max(380, 850 - (45 - this.timeLeft) * 11);
        this.spawnTimer += delta;

        if (this.spawnTimer >= interval) {
          this.spawnTimer = 0;
          this.trySpawn();
        }
      }

      trySpawn() {
        const empties = this.holes.filter(h => h.state === 'empty');
        if (empties.length === 0) return;

        const hole = Phaser.Utils.Array.GetRandom(empties);
        const roll = Math.random();

        let type = 'mole';
        let dur = 950;

        if (roll < 0.22) {
          type = 'bomb';
          dur = 1100;
        } else if (roll < 0.38) {
          type = 'gold';
          dur = 750;
        } else if (roll < 0.46) {
          type = 'star';
          dur = 600;
        }

        hole.state = type;
        hole.timer = 0;
        hole.duration = dur;
        this.drawItem(hole.itemGfx, type);
      }

      endGame() {
        this.gameState = 'over';
        if (this.timerEvent) this.timerEvent.remove();
        this.holes.forEach(h => {
          h.state = 'empty';
          h.itemGfx.clear();
        });

        SharedGame.submitScore('hammer-smash', this.score).then(isNewHigh => {
          document.getElementById('goScore').textContent = this.score;
          const badge = document.getElementById('goNewHigh');
          if (isNewHigh) {
            badge.classList.remove('hidden');
            SharedGame.confetti(60);
          } else {
            badge.classList.add('hidden');
          }
          document.getElementById('gameoverOverlay').classList.remove('hidden');
        });
      }
    }

    const config = {
      type: Phaser.AUTO,
      width: GAME_W,
      height: GAME_H,
      backgroundColor: '#0d0d1a',
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      },
      scene: [HammerScene]
    };

    const game = new Phaser.Game(config);

    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('startOverlay').classList.add('hidden');
      const scene = game.scene.getScene('HammerScene');
      if (scene) scene.startRun();
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
      document.getElementById('gameoverOverlay').classList.add('hidden');
      const scene = game.scene.getScene('HammerScene');
      if (scene) scene.startRun();
    });
  </script>
</body>
</html>
